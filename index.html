<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>تراكات</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c8102e">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
:root{--red:#c8102e;--org:#f58220;--bg:#f4f0ec;--s:#fff;--ink:#2b1a14;--mut:#7b6b63;--ln:#e6dcd2;--ok:#2f8f55;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.7 Cairo,Tahoma,Arial,sans-serif;padding-bottom:env(safe-area-inset-bottom,0)}
.w{max-width:900px;margin:0 auto;padding:12px}
button,input,select,textarea{font:inherit}
:focus-visible{outline:3px solid var(--org);outline-offset:2px}
.hero{position:relative;border-radius:16px;overflow:hidden;background:var(--red);color:#fff;min-height:190px;display:flex;align-items:flex-end}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.55}
.hero div{position:relative;padding:18px;background:linear-gradient(0deg,rgba(120,0,15,.85),transparent);width:100%}
.hero h1{margin:0;font-size:46px;line-height:1.1;font-weight:900;color:var(--org);text-shadow:0 2px 0 #7a0a18}
.hero p{margin:4px 0 0;font-weight:600}
.call{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}
.call a{flex:1;text-align:center;background:var(--s);border:2px solid var(--red);color:var(--red);border-radius:10px;padding:6px;font-weight:800;text-decoration:none}
.chips{position:sticky;top:0;z-index:5;display:flex;gap:6px;overflow-x:auto;padding:8px 0;background:var(--bg)}
.chips a{white-space:nowrap;background:var(--s);border:1px solid var(--ln);border-radius:99px;padding:4px 14px;color:var(--ink);text-decoration:none;font-weight:600}
.cat{background:var(--s);border:1px solid var(--ln);border-radius:14px;margin-bottom:12px;overflow:hidden}
.cat h2{margin:0;display:flex;align-items:center;gap:10px;background:var(--red);color:#fff;padding:6px 12px;font-size:18px;font-weight:800}
.cat h2 img{width:46px;height:46px;border-radius:50%;object-fit:cover;border:2px solid var(--org)}
.it{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;border-top:1px solid var(--ln);flex-wrap:wrap}
.it:first-of-type{border-top:0}.it.off{opacity:.45}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.add{border:2px solid var(--org);background:#fff7ee;color:var(--ink);border-radius:9px;padding:2px 10px;font-weight:700;cursor:pointer}
.add b{color:var(--red)}
.btn{border:0;background:var(--red);color:#fff;border-radius:10px;padding:10px 18px;font-weight:800;cursor:pointer}
.btn.o{background:var(--org);color:#2b1a14}.btn.g{background:none;border:1px solid var(--ln);color:var(--ink);padding:5px 10px;font-weight:600}
.btn:disabled{opacity:.5}
.bar{position:sticky;bottom:calc(8px + env(safe-area-inset-bottom,0));z-index:6}
.bar .btn{width:100%;box-shadow:0 4px 14px rgba(0,0,0,.25);font-size:17px}
.card{background:var(--s);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 8px}
label{display:block;font-size:13px;color:var(--mut);margin:6px 0 2px}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--ln);border-radius:9px;background:#fff;color:var(--ink)}
.q{display:flex;align-items:center;gap:8px}.q button{width:30px;height:30px;border-radius:8px;border:1px solid var(--ln);background:#fff;font-weight:800;cursor:pointer}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--ln)}
.steps{display:flex;gap:4px;margin:10px 0}.steps div{flex:1;text-align:center;font-size:12px;padding:6px 2px;border-radius:7px;background:var(--bg);border:1px solid var(--ln);color:var(--mut)}
.steps .d{background:var(--ok);color:#fff;border-color:var(--ok)}.steps .n{background:var(--org);color:#2b1a14;border-color:var(--org);font-weight:800}
.tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}.tabs button{flex:1;white-space:nowrap;padding:8px 12px;border-radius:9px;border:1px solid var(--ln);background:#fff;font-weight:700;cursor:pointer}.tabs .on{background:var(--ink);color:#fff}
.k{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:12px}.k div{background:var(--s);border:1px solid var(--ln);border-radius:12px;padding:12px}.k b{display:block;font-size:26px}.k span{color:var(--mut);font-size:13px}
.m{color:var(--mut)}.tag{background:var(--org);color:#2b1a14;border-radius:99px;padding:0 10px;font-size:12px;font-weight:700}
.warn{background:#fff3cd;border:1px solid #e8c766;border-radius:10px;padding:10px;margin-bottom:12px}
.pr{width:76px;display:inline-block;padding:4px 6px}
[hidden]{display:none!important}
</style>
</head>

{n:"سندوتشات شعبي",i:"fries",o:["فينو","عيش بلدي"],it:[["كبدة",10,10],["سجق",10,10],["كفتة داوود باشا",15,15]]},
{n:"الإضافات",i:"fries",o:["عادي","كبير"],it:[["باكت بطاطس",25,30],["باكت بطاطس شيدر",40],["بطاطس",10],["أرز بسمتي",30]]},
{n:"المقبلات",i:"fries",o:["صغير","كبير"],it:[["كلوسلو",20,30],["توميه",5,15],["توميه اسبايسي",5,15],["طحينة",5,15],["مخلل مشكل",10],["مخلل سوري (ليفت)",10],["خيار مخلل",10],["صوص بيج تيستي",15],["صوص رانش",15],["صوص باربيكيو",10],["صوص شيدر",10]]},
{n:"المشروبات",i:"fries",it:[["كانز بيبسي",20],["لتر بيبسي",40],["مياه معدنية صغيرة",10],["مياه معدنية كبيرة",15]]}];

const $=s=>document.querySelector(s),app=$("#app");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);v===null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};
if(!FB.apiKey){app.innerHTML='<div class="card"><h3>باقي خطوة واحدة</h3><p>الصق إعدادات Firebase في أول الكود (متغير FB) ثم ارفع الملف.</p></div>';throw 0}
const ap=initializeApp(FB),db=getFirestore(ap),auth=getAuth(ap);
let menu=[],cfg={fee:0,open:true},cart={},unsubs=[],me=null;
const clear=()=>{unsubs.forEach(u=>u());unsubs=[]};
const ST=[["new","تم الاستلام"],["prep","قيد التحضير"],["ready","جاهز"],["out","خرج للتوصيل"],["done","تم التسليم"]];
const stList=t=>t==="pickup"?ST.filter(x=>x[0]!=="out"):ST;
const steps=(s,t)=>{const L=stList(t),i=L.findIndex(x=>x[0]===s);return s==="cancelled"?'<p class="tag" style="background:#f8d0d0">تم إلغاء الطلب</p>':`<div class="steps">${L.map((x,j)=>`<div class="${j<i||s==="done"?"d":j===i?"n":""}">${x[1]}</div>`).join("")}</div>`};
const dayOf=o=>{const d=o.createdAt?.toDate?o.createdAt.toDate():new Date();return d.toISOString().slice(0,10)};
const mins=o=>o.createdAt?.toDate?Math.max(0,Math.round((Date.now()-o.createdAt.toDate())/6e4)):0;

/* قائمة الطعام: من قاعدة البيانات، وإن كانت فاضية نستخدم الافتراضية */
function flat(){const r=[];DEF.forEach((c,ci)=>c.it.forEach((x,ii)=>r.push({id:"",cat:c.n,img:c.i,name:x[0],opts:x.slice(1).map((p,k)=>({l:x.length>2?c.o[k]:"",p})),on:true,ord:ci*1000+ii})));return r}
const items=()=>menu.length?menu:flat();

function route(){clear();(location.hash==="#admin"?staff:shop)()}
addEventListener("hashchange",route);

/* ================= الزبون ================= */
function shop(){
 const cats=[...new Set(items().map(x=>x.cat))],mine=ls("myorder");
 app.innerHTML=`<div class="hero"><img src="${IMG.hero}" alt=""><div><h1>تراكات</h1><p>كريب · سندوتشات · شاورما · وجبات · ريزو</p><p>امتداد شارع أحمد عرابي، أمام سنترال البراجيل</p></div></div>
 <div class="call">${PHONES.map(p=>`<a href="tel:${p}">اتصل ${p}</a>`).join("")}</div>
 ${mine?'<div class="card" id="tr"></div>':""}${cfg.open?"":'<div class="warn">الطلب أونلاين متوقف حاليًا. تقدر تتصل بينا.</div>'}
 <div class="chips">${cats.map((c,i)=>`<a href="#c${i}" onclick="document.getElementById('c${i}').scrollIntoView({behavior:'smooth'});return false">${c}</a>`).join("")}</div>
 ${cats.map((c,i)=>{const L=items().filter(x=>x.cat===c).sort((a,b)=>a.ord-b.ord);return `<section class="cat" id="c${i}"><h2><img src="${IMG[L[0].img]||IMG.hero}" alt="">${c}</h2>${L.map(x=>`<div class="it ${x.on?"":"off"}"><div>${esc(x.name)}</div><div class="opts">${x.on?x.opts.map((o,k)=>`<button class="add" data-k="${esc(x.cat+"|"+x.name+"|"+k)}">${o.l?esc(o.l)+" ":""}<b>${o.p}</b> ج</button>`).join(""):'<span class="m">غير متاح</span>'}</div></div>`).join("")}</section>`}).join("")}
 <div class="bar"><button class="btn" id="cb" hidden></button></div><div id="co"></div>`;
 if(mine)unsubs.push(onSnapshot(doc(db,"orders",mine),s=>{const o=s.data();const t=$("#tr");if(!o||!t){return}
  t.innerHTML=`<h3>طلبك رقم ${o.no}</h3>${steps(o.status,o.type)}<p class="m">${o.items.map(i=>i.q+"× "+esc(i.n)).join("، ")}<br>الإجمالي ${o.total} ج</p>${["done","cancelled"].includes(o.status)?'<button class="btn o" id="nw">طلب جديد</button>':'<p class="m">لو فيه أي استفسار اتصل بالمحل.</p>'}`;
  const b=$("#nw");if(b)b.onclick=()=>{ls("myorder",null);shop()}},()=>{}));
 app.onclick=e=>{const b=e.target.closest(".add");if(!b||!cfg.open)return;const[c,n,k]=b.dataset.k.split("|"),x=items().find(y=>y.cat===c&&y.name===n),o=x.opts[k],key=c+"|"+n+"|"+k;
  cart[key]=cart[key]||{n:x.name+(o.l?" ("+o.l+")":""),p:o.p,q:0};cart[key].q++;sum()};
 sum()}
const cl=()=>Object.entries(cart).filter(e=>e[1].q>0);
const sub=()=>cl().reduce((a,[,x])=>a+x.p*x.q,0);
function sum(){const b=$("#cb");if(!b)return;const n=cl().reduce((a,[,x])=>a+x.q,0);b.hidden=!n;b.textContent=`مراجعة الطلب (${n}) · ${sub()} ج`;b.onclick=checkout}
function checkout(){
 const co=$("#co");
 co.innerHTML=`<div class="card" id="ck"><h3>طلبك</h3>${cl().map(([k,x])=>`<div class="row"><span>${esc(x.n)}</span><span class="q"><button data-d="${esc(k)}" data-s="-1" aria-label="إنقاص">−</button><b>${x.q}</b><button data-d="${esc(k)}" data-s="1" aria-label="زيادة">+</button></span><span>${x.p*x.q} ج</span></div>`).join("")}
 <form id="f"><label>الاسم</label><input id="nm" required maxlength="60" value="${esc(ls("nm")||"")}"><label>رقم الموبايل</label><input id="ph" required inputmode="tel" pattern="01[0-9]{9}" title="رقم موبايل مصري من 11 رقم" value="${esc(ls("ph")||"")}"><label>طريقة الاستلام</label><select id="ty"><option value="delivery">توصيل</option><option value="pickup">استلام من المحل</option></select><div id="ab"><label>العنوان بالتفصيل</label><input id="ad" maxlength="200" value="${esc(ls("ad")||"")}"></div><label>ملاحظات (اختياري)</label><input id="nt" maxlength="200"><p id="tt" style="font-weight:800"></p><button class="btn" id="go" style="width:100%">تأكيد الطلب</button></form></div>`;
 co.scrollIntoView({behavior:"smooth"});
 const tot=()=>{const d=$("#ty").value==="delivery";$("#ab").hidden=!d;$("#ad").required=d;const f=d?+cfg.fee||0:0;$("#tt").textContent=`الإجمالي ${sub()+f} ج`+(f?` (شامل التوصيل ${f} ج)`:"");return sub()+f};tot();$("#ty").onchange=tot;
 co.onclick=e=>{const b=e.target.closest("[data-d]");if(!b)return;const x=cart[b.dataset.d];x.q=Math.max(0,x.q+ +b.dataset.s);cl().length?checkout():(co.innerHTML="");sum()};
 $("#f").onsubmit=async e=>{e.preventDefault();const last=+ls("lastAt")||0;if(Date.now()-last<60000){alert("استنى دقيقة بين كل طلب والتاني");return}
  const go=$("#go");go.disabled=true;const total=tot(),type=$("#ty").value;
  try{const r=await addDoc(collection(db,"orders"),{no:Math.floor(1000+Math.random()*9000),items:cl().map(([,x])=>({n:x.n,p:x.p,q:x.q})),total,name:$("#nm").value.trim(),phone:$("#ph").value.trim(),type,addr:type==="delivery"?$("#ad").value.trim():"",note:$("#nt").value.trim(),status:"new",createdAt:serverTimestamp()});
   ls("myorder",r.id);ls("lastAt",String(Date.now()));ls("nm",$("#nm").value);ls("ph",$("#ph").value);ls("ad",$("#ad").value);cart={};shop();scrollTo(0,0)}
  catch(er){alert("تعذر إرسال الطلب. تأكد من الاتصال أو كلمنا تليفون.");go.disabled=false}}}

/* ================= العاملين والمالك ================= */
function staff(){
 app.innerHTML=`<div class="card"><h3>الإدارة والتحكم</h3><form id="lf"><label>كلمة مرور الإدارة</label><input id="p" type="password" required autocomplete="current-password"><p id="er" style="color:var(--red)"></p><button class="btn" style="width:100%">دخول</button></form></div>`;
 $("#lf").onsubmit=async e=>{e.preventDefault();
  const lk=+ls("lock")||0;if(Date.now()<lk){$("#er").textContent="محاولات كتير غلط. جرّب بعد "+Math.ceil((lk-Date.now())/60000)+" دقيقة";return}
  try{await setPersistence(auth,browserSessionPersistence);await signInWithEmailAndPassword(auth,ADMIN_EMAIL,$("#p").value);ls("fails","0")}
  catch(x){const f=(+ls("fails")||0)+1;ls("fails",String(f));if(f>=5){ls("lock",String(Date.now()+3e5));ls("fails","0")}$("#er").textContent="كلمة المرور غير صحيحة"}};
 unsubs.push(onAuthStateChanged(auth,async u=>{if(!u)return;
  const s=await getDoc(doc(db,"users",u.uid));me=s.exists()&&s.data().active&&s.data().role==="owner"?{uid:u.uid,...s.data()}:null;
  if(!me){await signOut(auth);$("#er").textContent="هذا الحساب غير مصرح له";return}panel()}))}
function panel(){clear();
 const own=me.role==="owner";
 app.innerHTML=`<div class="row" style="border:0"><b>أهلاً ${esc(me.name)}</b><button class="btn g" id="out">خروج</button></div><div class="tabs"><button data-t="b" class="on">الطلبات</button>${own?'<button data-t="d">الإيرادات</button><button data-t="m">المنيو</button><button data-t="s">الإعدادات</button>':""}</div><div id="pn"></div>`;
 $("#out").onclick=async()=>{await signOut(auth);location.hash="";location.reload()};
 const go=t=>{unsubs.forEach(u=>u());unsubs=[];document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b.dataset.t===t));({b:board,d:dash,m:menuEd,s:team}[t])()};
 document.querySelector(".tabs").onclick=e=>{const b=e.target.closest("button");if(b)go(b.dataset.t)};go("b")}

function board(){
 $("#pn").innerHTML='<div id="bd"></div>';let first=true;
 const beep=()=>{try{const c=new AudioContext(),o=c.createOscillator();o.connect(c.destination);o.frequency.value=880;o.start();o.stop(c.currentTime+.4)}catch(e){}};
 unsubs.push(onSnapshot(query(collection(db,"orders"),orderBy("createdAt","desc"),limit(80)),q=>{
  if(!first&&q.docChanges().some(c=>c.type==="added"))beep();first=false;
  const L=q.docs.filter(d=>!["done","cancelled"].includes(d.data().status)).reverse();
  $("#bd").innerHTML=L.length?L.map(d=>{const o=d.data(),l=stList(o.type),i=l.findIndex(x=>x[0]===o.status),nx=l[i+1];
   return `<div class="card"><b>طلب ${o.no}</b> · ${o.type==="pickup"?"استلام":"توصيل"} · <span class="m">من ${mins(o)} دقيقة</span><br>${esc(o.name)} · <a href="tel:${esc(o.phone)}">${esc(o.phone)}</a>${o.addr?"<br>"+esc(o.addr):""}<br>${o.items.map(x=>x.q+"× "+esc(x.n)).join("، ")}${o.note?`<br><i>ملاحظة: ${esc(o.note)}</i>`:""}<br><b>${o.total} ج</b>${steps(o.status,o.type)}${nx?`<button class="btn" data-id="${d.id}" data-n="${nx[0]}">${nx[1]}</button> `:""}<button class="btn g" data-id="${d.id}" data-n="cancelled">إلغاء</button></div>`}).join(""):'<div class="card m">لا توجد طلبات شغالة دلوقتي.</div>'}));
 $("#pn").onclick=async e=>{const b=e.target.closest("[data-id]");if(!b)return;if(b.dataset.n==="cancelled"&&!confirm("إلغاء الطلب؟"))return;
  try{await updateDoc(doc(db,"orders",b.dataset.id),{status:b.dataset.n})}catch(x){alert("تعذر التحديث")}}}

function dash(){
 $("#pn").innerHTML='<div id="kp"></div>';
 unsubs.push(onSnapshot(query(collection(db,"orders"),orderBy("createdAt","desc"),limit(1000)),q=>{
  const O=q.docs.map(d=>d.data()),ok=O.filter(o=>o.status==="done"),t=new Date().toISOString().slice(0,10),w=new Date(Date.now()-6*864e5).toISOString().slice(0,10),S=a=>a.reduce((x,o)=>x+o.total,0),c={};
  ok.forEach(o=>o.items.forEach(i=>c[i.n]=(c[i.n]||0)+i.q));
  const top=Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,8);
  $("#kp").innerHTML=`<div class="k"><div><b>${S(ok.filter(o=>dayOf(o)===t))}</b><span>إيراد اليوم (ج)</span></div><div><b>${S(ok.filter(o=>dayOf(o)>=w))}</b><span>آخر 7 أيام (ج)</span></div><div><b>${S(ok)}</b><span>إجمالي (ج)</span></div><div><b>${ok.length?Math.round(S(ok)/ok.length):0}</b><span>متوسط الطلب (ج)</span></div><div><b>${O.filter(o=>!["done","cancelled"].includes(o.status)).length}</b><span>طلبات شغالة</span></div><div><b>${O.filter(o=>o.status==="cancelled").length}</b><span>ملغية</span></div></div><div class="card"><h3>الأكثر مبيعًا</h3>${top.map(([n,q])=>`<div class="row"><span>${esc(n)}</span><b>${q}</b></div>`).join("")||'<span class="m">لسه مفيش طلبات مكتملة.</span>'}</div><p class="m">الإيراد محسوب من الطلبات المكتملة فقط (آخر 1000 طلب).</p>`}))}

function menuEd(){
 $("#pn").innerHTML='<div id="me"></div>';
 unsubs.push(onSnapshot(collection(db,"menu"),q=>{menu=q.docs.map(d=>({id:d.id,...d.data()}));
  const cats=[...new Set(items().map(x=>x.cat))];
  $("#me").innerHTML=(menu.length?"":'<div class="warn">المنيو لسه ما اتحملش لقاعدة البيانات. <button class="btn o" id="seed">تحميل المنيو الأساسي</button></div>')+
  (menu.length?`<div class="card"><h3>إضافة صنف</h3><form id="af"><select id="ac">${cats.map(c=>`<option>${c}</option>`).join("")}</select><input id="an" placeholder="اسم الصنف" required><input id="ap" type="number" min="1" placeholder="السعر" required><button class="btn">إضافة</button></form></div>`+cats.map(c=>`<div class="card"><h3>${c}</h3>${items().filter(x=>x.cat===c).sort((a,b)=>a.ord-b.ord).map(x=>`<div class="row"><span>${esc(x.name)}</span><span>${x.opts.map((o,k)=>`${o.l?esc(o.l):""} <input class="pr" type="number" min="1" value="${o.p}" data-id="${x.id}" data-k="${k}">`).join(" ")} <label style="display:inline"><input type="checkbox" style="width:auto" ${x.on?"checked":""} data-on="${x.id}"> متاح</label></span></div>`).join("")}</div>`).join(""):"")}));
 $("#pn").onclick=async e=>{if(e.target.id!=="seed")return;e.target.disabled=true;const b=writeBatch(db);flat().forEach(x=>{const{id,...r}=x;b.set(doc(collection(db,"menu")),r)});await b.commit()};
 $("#pn").onchange=async e=>{const t=e.target;
  if(t.dataset.on){await updateDoc(doc(db,"menu",t.dataset.on),{on:t.checked})}
  else if(t.dataset.k!==undefined){const x=menu.find(y=>y.id===t.dataset.id),o=x.opts.map(z=>({...z}));o[+t.dataset.k].p=+t.value;await updateDoc(doc(db,"menu",x.id),{opts:o})}};
 $("#pn").onsubmit=async e=>{e.preventDefault();const c=$("#ac").value,r=menu.filter(x=>x.cat===c);await addDoc(collection(db,"menu"),{cat:c,img:r[0]?.img||"hero",name:$("#an").value.trim(),opts:[{l:"",p:+$("#ap").value}],on:true,ord:Math.max(...r.map(x=>x.ord),0)+1});e.target.reset()}}

function team(){
 $("#pn").innerHTML=`<div class="card"><h3>الإعدادات</h3><label>رسوم التوصيل (ج)</label><input id="fe" type="number" min="0"><label style="display:flex;gap:8px;align-items:center"><input id="op" type="checkbox" style="width:auto"> استقبال الطلبات أونلاين</label><button class="btn o" id="sv" style="margin-top:8px">حفظ</button></div>`;
 getDoc(doc(db,"settings","main")).then(s=>{const c=s.data()||{};$("#fe").value=c.fee||0;$("#op").checked=c.open!==false});
 $("#sv").onclick=async()=>{await setDoc(doc(db,"settings","main"),{fee:+$("#fe").value||0,open:$("#op").checked});alert("تم الحفظ")}}

/* بدء التشغيل */
(async()=>{try{const s=await getDoc(doc(db,"settings","main"));if(s.exists())cfg={...cfg,...s.data()};const m=await getDocs(collection(db,"menu"));menu=m.docs.map(d=>({id:d.id,...d.data()}))}catch(e){}route()})();
</script>
